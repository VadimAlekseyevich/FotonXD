name: Build Qt 5.15 task 03

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 5 development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev libqt5opengl5-dev
      - name: Configure
        run: cmake -S task_03 -B build/task_03 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/task_03 --parallel 2
      - name: Unit tests (headless)
        run: ctest --test-dir build/task_03 --output-on-failure

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
          cache: true
      - name: Configure (MSVC x64)
        shell: pwsh
        run: cmake -S task_03 -B build/task_03 -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/task_03 --config Release --parallel 2
      - name: Unit tests (headless)
        run: ctest --test-dir build/task_03 -C Release --output-on-failure
